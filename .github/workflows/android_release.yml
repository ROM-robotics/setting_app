name: Android APK Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'android-alpha*.*.*'
      - 'android-beta*.*.*'
      - 'android-r*.*.*'
  # Manual trigger ကို ခွင့်ပြုခြင်း (GitHub UI မှ Run workflow နှိပ်ပြီး run လို့ရမည်)
  workflow_dispatch:

jobs:
  build_android_apk:
    runs-on: ubuntu-22.04 # Android Build အတွက်

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Setup Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Install Qt 6.8.3 for Android
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.3'
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qtnetworkauth'

      - name: 4. Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true
          local-cache: true

      - name: 5. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 6. Install Android SDK Build Tools and Platform
        run: |
          sdkmanager --install "build-tools;34.0.0" "platforms;android-34"
          sdkmanager --licenses

      - name: 7. Create Build Directory
        run: mkdir -p build-android

      - name: 8. Configure CMake for Android
        run: |
          cmake -S setting_app -B build-android \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_PREFIX_PATH=${{ env.Qt6_DIR }} \
            -DQT_HOST_PATH=${{ env.Qt6_DIR }}/../gcc_64 \
            -DANDROID_NDK=$ANDROID_NDK_ROOT \
            -DANDROID_SDK=$ANDROID_HOME

      - name: 9. Build Qt Application (Release)
        run: cmake --build build-android --config Release -j$(nproc)

      - name: 10. Create Android APK using androiddeployqt
        run: |
          # Find Qt androiddeployqt tool
          ANDROIDDEPLOYQT=${{ env.Qt6_DIR }}/bin/androiddeployqt
          
          # Create deployment settings JSON
          cat > build-android/android-deploy.json << EOF
          {
            "description": "Robot WiFi Manager",
            "qt": "${{ env.Qt6_DIR }}",
            "sdk": "$ANDROID_HOME",
            "ndk": "$ANDROID_NDK_ROOT",
            "toolchain-prefix": "llvm",
            "tool-prefix": "llvm",
            "useLLVM": true,
            "ndk-host": "linux-x86_64",
            "target-architecture": "arm64-v8a",
            "android-package-source-directory": "${{ github.workspace }}/setting_app/android",
            "qml-root-path": "${{ github.workspace }}/setting_app",
            "application-binary": "${{ github.workspace }}/build-android/libsetting_app_arm64-v8a.so",
            "android-package": "com.romrobotics.wifimanager",
            "android-app-name": "Robot WiFi Manager",
            "stdcpp-path": "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          }
          EOF
          
          # Run androiddeployqt
          $ANDROIDDEPLOYQT \
            --input build-android/android-deploy.json \
            --output build-android/android-build \
            --android-platform android-34 \
            --jdk /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.*/x64 \
            --gradle \
            --release

      - name: 11. Sign APK (if keystore available)
        id: sign_apk
        run: |
          # Check if keystore secrets are available
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Signing APK with keystore..."
            
            # Decode keystore
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
            
            # Sign APK
            APK_FILE=$(find build-android/android-build/build/outputs/apk/release -name "*.apk" | head -n1)
            
            jarsigner -verbose \
              -sigalg SHA256withRSA \
              -digestalg SHA-256 \
              -keystore keystore.jks \
              -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
              -keypass "${{ secrets.KEY_PASSWORD }}" \
              "$APK_FILE" \
              "${{ secrets.KEY_ALIAS }}"
            
            # Zipalign
            $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 "$APK_FILE" "${APK_FILE%.apk}-aligned.apk"
            mv "${APK_FILE%.apk}-aligned.apk" "$APK_FILE"
            
            echo "signed=true" >> $GITHUB_OUTPUT
          else
            echo "No keystore configured, using unsigned APK"
            echo "signed=false" >> $GITHUB_OUTPUT
          fi

      - name: 12. Rename APK for Release
        id: rename_apk
        run: |
          # Tag push ဖြစ်လျှင် tag name ကို သုံးမည်၊ မဟုတ်လျှင် commit SHA ကို သုံးမည်
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION_NAME=${{ github.ref_name }}
          else
            VERSION_NAME="dev-$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          
          # Find the generated APK file
          APK_FILE=$(find build-android/android-build/build/outputs/apk/release -name "*.apk" | head -n1)
          
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file found"
            find build-android -name "*.apk"
            exit 1
          fi
          
          echo "Found APK: $APK_FILE"
          
          # Determine if signed or unsigned
          if [ "${{ steps.sign_apk.outputs.signed }}" == "true" ]; then
            FINAL_NAME="robot-wifi-manager-${VERSION_NAME}-arm64-v8a-signed.apk"
          else
            FINAL_NAME="robot-wifi-manager-${VERSION_NAME}-arm64-v8a-unsigned.apk"
          fi
          
          cp "$APK_FILE" "$FINAL_NAME"
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "apk_file=${FINAL_NAME}" >> $GITHUB_OUTPUT

      - name: 13. Upload APK as Artifact (for non-tag builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Robot-WiFi-Manager-Android-APK
          path: ${{ steps.rename_apk.outputs.apk_file }}
          retention-days: 30

      - name: 14. Upload APK as GitHub Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.rename_apk.outputs.apk_file }}
          body: |
            ## 🎉 Robot WiFi Manager - ${{ github.ref_name }} (Android)

            ### 📱 Android APK Release

            This release contains the **APK** for Android devices (ARM64-v8a).

            #### ✨ Features
            - WiFi network scanning and selection
            - Touch-optimized UI for mobile devices
            - Portrait and landscape support
            - Dual connection modes: Ethernet & Bluetooth
            - Material Design interface

            #### 🚀 How to Install
            1. Download the APK file
            2. Enable "Install from Unknown Sources" on your Android device
            3. Transfer APK to your device
            4. Tap to install

            #### 📱 Requirements
            - Android 8.0 (API 26) or newer
            - ARM64-v8a architecture
            - Robot computer running `robot_server.py`
            - WiFi or Bluetooth connectivity

            #### 🔒 Security Note
            ${{ steps.sign_apk.outputs.signed == 'true' && '✅ This APK is **digitally signed** for security.' || '⚠️ This APK is **unsigned** (development build). For production use, configure signing keys.' }}

            #### 📝 Release Type
            - **alpha**: Early testing release (may contain bugs)
            - **beta**: Feature-complete, testing phase
            - **r (release)**: Stable production release

            #### 🛠️ Built With
            - **Qt**: 6.8.3 for Android
            - **NDK**: r26d
            - **Target API**: Android 34 (14)
            - **Min API**: Android 26 (8.0)
            - **Architecture**: ARM64-v8a

            #### 📚 Documentation
            See `ANDROID_USAGE_MM.md` for detailed usage instructions.

            #### ⚠️ Permissions Required
            - `INTERNET` - Network communication
            - `ACCESS_WIFI_STATE` - WiFi status
            - `CHANGE_WIFI_STATE` - WiFi management
            - `BLUETOOTH` - Bluetooth communication
            - `BLUETOOTH_ADMIN` - Bluetooth control

            ---

            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}

      - name: 15. Build Summary
        if: always()
        run: |
          echo "## 📊 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: Android (ARM64-v8a)" >> $GITHUB_STEP_SUMMARY
          echo "- **Qt Version**: 6.8.3" >> $GITHUB_STEP_SUMMARY
          echo "- **NDK Version**: r26d" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Type**: Release" >> $GITHUB_STEP_SUMMARY
          echo "- **Signed**: ${{ steps.sign_apk.outputs.signed }}" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "- **Version**: ${{ steps.rename_apk.outputs.version_name }}" >> $GITHUB_STEP_SUMMARY
            echo "- **APK**: ${{ steps.rename_apk.outputs.apk_file }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Build Type**: Development Build" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build completed successfully!" >> $GITHUB_STEP_SUMMARY
