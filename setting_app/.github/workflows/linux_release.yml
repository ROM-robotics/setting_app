name: Linux Qt AppImage Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'linux-alpha[0-9]+.[0-9]+.[0-9]+'
      - 'linux-beta[0-9]+.[0-9]+.[0-9]+'
      - 'linux-r[0-9]+.[0-9]+.[0-9]+'
  # Manual trigger ကို ခွင့်ပြုခြင်း (GitHub UI မှ Run workflow နှိပ်ပြီး run လို့ရမည်)
  workflow_dispatch:

jobs:
  build_linux_appimage:
    runs-on: ubuntu-22.04 # Linux Build အတွက်

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Install Qt 6.8.3
        # Qt ကို အလိုအလျောက် Install လုပ်ပေးမယ့် Action
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.3'
          target: 'desktop'
          modules: 'qtnetworkauth'
          # Ubuntu 22.04 ကို သုံးသောကြောင့် GCC ဖြင့် အလုပ်လုပ်မည်

      - name: 2.5. Install xcb-cursor library and Bluetooth dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 \
            libbluetooth-dev \
            bluez

      - name: 3. Create Build Directory
        run: mkdir -p build

      - name: 4. Configure CMake
        # Qt 6 ကို CMake ဖြင့် သုံးသောအခါ CMAKE_PREFIX_PATH ကို သတ်မှတ်ပေးရန် လိုအပ်သည်
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=${{ env.Qt6_DIR }} \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install

      - name: 5. Build Qt Application (Release)
        run: cmake --build build --config Release -j$(nproc)

      - name: 5.5. Install Qt Application
        run: cmake --install build

      - name: 6. Deploy Qt Binaries with linuxdeployqt
        # linuxdeployqt ကို download လုပ်ပြီး Executable အဖြစ် ပြောင်းသည်
        run: |
          # linuxdeployqt ကို download လုပ်ခြင်း
          wget -q -O linuxdeployqt https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
          chmod +x linuxdeployqt

          # AppDir ဖွဲ့စည်းပုံကို စတင်တည်ဆောက်ခြင်း
          mkdir -p AppDir/usr/bin
          cp install/bin/setting_app AppDir/usr/bin/

          # .desktop file ကို AppDir ထဲမှာ ဖန်တီးခြင်း
          mkdir -p AppDir/usr/share/applications
          cat > AppDir/usr/share/applications/setting_app.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Robot WiFi Manager
          Comment=Manage robot WiFi connections via Ethernet or Bluetooth
          Exec=setting_app
          Icon=robot_wifi_manager
          Categories=Utility;Network;Qt;
          Version=1.0
          EOF

          # Create a simple icon if not exists (placeholder)
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          if [ ! -f "resources/robot_wifi_manager.png" ]; then
            # Create a simple placeholder icon using ImageMagick (if available)
            if command -v convert &> /dev/null; then
              convert -size 256x256 xc:orange -gravity center \
                -pointsize 40 -fill white -annotate +0+0 "WiFi\nManager" \
                AppDir/usr/share/icons/hicolor/256x256/apps/robot_wifi_manager.png
            fi
          else
            cp resources/robot_wifi_manager.png AppDir/usr/share/icons/hicolor/256x256/apps/
          fi

          # linuxdeployqt ကို Run ပြီး AppImage ဖန်တီးခြင်း
          # -appimage ဖြင့် AppImage ဖိုင် ထွက်လာမည်
          ./linuxdeployqt AppDir/usr/share/applications/setting_app.desktop \
            -bundle-non-qt-libs \
            -appimage

      - name: 7. Rename AppImage for Release
        # Tag နာမည် (ဥပမာ linux-alpha0.0.1) ကို ဖိုင်နာမည်မှာ ထည့်ပြီး ပြင်ဆင်ခြင်း
        id: rename_appimage
        run: |
          # Tag push ဖြစ်လျှင် tag name ကို သုံးမည်၊ မဟုတ်လျှင် commit SHA ကို သုံးမည်
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION_NAME=${{ github.ref_name }}
          else
            VERSION_NAME="dev-$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          
          # Find the generated AppImage file (linuxdeployqt creates based on Name field)
          APPIMAGE_FILE=$(ls Robot_WiFi_Manager-*-x86_64.AppImage 2>/dev/null | head -n1)
          if [ -z "$APPIMAGE_FILE" ]; then
            # Try alternative naming pattern
            APPIMAGE_FILE=$(ls *-x86_64.AppImage 2>/dev/null | head -n1)
          fi
          
          if [ -z "$APPIMAGE_FILE" ]; then
            echo "Error: No AppImage file found"
            ls -la
            exit 1
          fi
          
          echo "Found AppImage: $APPIMAGE_FILE"
          FINAL_NAME="robot-wifi-manager-${VERSION_NAME}-x86_64.AppImage"
          mv "$APPIMAGE_FILE" "$FINAL_NAME"
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "appimage_file=${FINAL_NAME}" >> $GITHUB_OUTPUT

      - name: 7.5. Upload AppImage as Artifact (for non-tag builds)
        # Tag မဟုတ်ဘဲ manual workflow dispatch များအတွက် artifact အဖြစ် upload လုပ်ခြင်း
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Robot-WiFi-Manager-Linux-AppImage
          path: ${{ steps.rename_appimage.outputs.appimage_file }}
          retention-days: 30

      - name: 8. Upload AppImage as GitHub Release Asset
        # softprops/action-gh-release ကို သုံးပြီး release assets တင်ခြင်း
        # Tag push ဖြစ်မှသာ Release တင်မည် (manual dispatch များတွင် skip လုပ်မည်)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          # Tag ကို အသုံးပြုခြင်း
          tag_name: ${{ github.ref_name }}
          # Asset အဖြစ် တင်မည့် ဖိုင်
          files: ${{ steps.rename_appimage.outputs.appimage_file }}
          # Release Notes အလိုအလျောက် ရေးသားခြင်း
          body: |
            ## 🎉 Robot WiFi Manager - ${{ github.ref_name }} (Linux Desktop)

            ### 📦 Linux AppImage Release

            This release contains the **AppImage** binary for Linux (Ubuntu 22.04+).

            #### ✨ Features
            - WiFi network scanning and selection
            - Dialog-based WiFi connection management
            - IP address display
            - Dual connection modes: Ethernet & Bluetooth
            - Landscape UI optimized for desktop (1200x600)

            #### 🚀 How to Use
            1. Download the AppImage file
            2. Make it executable: `chmod +x robot-wifi-manager-*.AppImage`
            3. Run: `./robot-wifi-manager-*.AppImage`

            #### 🔧 Requirements
            - Ubuntu 22.04 or newer (or compatible Linux distribution)
            - Robot computer running `robot_server.py`
            - Network connection (Ethernet or Bluetooth)

            #### 📝 Release Type
            - **alpha**: Early testing release (may contain bugs)
            - **beta**: Feature-complete, testing phase
            - **r (release)**: Stable production release

            #### 🛠️ Built With
            - **Qt**: 6.8.3
            - **CMake**: 3.22+
            - **Compiler**: GCC (Ubuntu 22.04)
            - **Modules**: Widgets, Network, Bluetooth

            #### 📚 Documentation
            See `DESKTOP_USAGE_MM.md` and `QUICK_REFERENCE_MM.md` for detailed usage instructions.

            ---

            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}

      - name: 9. Build Summary
        if: always()
        run: |
          echo "## 📊 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: Linux (Ubuntu 22.04)" >> $GITHUB_STEP_SUMMARY
          echo "- **Qt Version**: 6.8.3" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Type**: Release" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "- **Version**: ${{ steps.rename_appimage.outputs.version_name }}" >> $GITHUB_STEP_SUMMARY
            echo "- **AppImage**: ${{ steps.rename_appimage.outputs.appimage_file }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Build Type**: Development Build" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build completed successfully!" >> $GITHUB_STEP_SUMMARY
